# ==========================================
# Servidor
# ==========================================
server.port=8000

# ==========================================
# Banco de dados (mesmo SQLite dev.db usado pelo backend antigo)
# Caminho relativo ao diretorio de execucao (a raiz do repo fica um nivel acima).
# ==========================================
spring.datasource.url=jdbc:sqlite:${NUTRIMIND_DB_PATH:../dev.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite nao lida bem com escrita concorrente: um unico conexao evita "database is locked".
spring.datasource.hikari.maximum-pool-size=1

# ==========================================
# JPA / Hibernate
# Nunca alterar o schema: o dev.db ja existe (criado pelo Prisma).
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=true
# Usa os nomes de coluna exatamente como nas entidades/@Column (sem converter para snake_case),
# pois o schema do Prisma usa camelCase: createdAt, ordemExibicao, tempoPreparo, etc.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# Jackson
# ==========================================
spring.jackson.default-property-inclusion=always

# ==========================================
# JWT (claims compativeis com o frontend: token Bearer + claim "id")
# ==========================================
nutrimind.jwt.secret=${NUTRIMIND_JWT_SECRET:nutrimind-dev-secret-change-me-please-0123456789abcdef}
nutrimind.jwt.expiration-ms=86400000

# ==========================================
# CORS (libera o dev server do Vite)
# ==========================================
nutrimind.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
